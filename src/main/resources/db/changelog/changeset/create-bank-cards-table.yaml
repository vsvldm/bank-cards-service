databaseChangeLog:
  - changeSet:
      id: create-bank-cards
      author: Vsevolod
      changes:
        - createTable:
            tableName: bank_cards
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: encrypted_card_number
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: encrypted_cvv
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: numeric(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: date
        - createIndex:
            tableName: bank_cards
            indexName: idx_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: bank_cards
            indexName: idx_status
            columns:
              - column:
                  name: status