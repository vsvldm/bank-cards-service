databaseChangeLog:
  - changeSet:
      id: create-transactions
      author: Vsevolod
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: source_card_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transactions_source_card
                    references: bank_cards(id)
              - column:
                  name: target_card_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transaction_target_card
                    references: bank_cards(id)
              - column:
                  name: amount
                  type: numeric(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false